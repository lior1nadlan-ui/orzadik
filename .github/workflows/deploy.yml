# Deploy the site to Cloudflare Workers on every push to main.
#
# WHY THIS EXISTS
# Until 2026-08-20 this repository had no workflows at all. Merging to main
# changed nothing a visitor could see: production is the Worker named `orzarua`
# (see wrangler.jsonc), and somebody had to run wrangler by hand for a change to
# go live. Four PRs of product photographs sat merged and invisible before
# anyone noticed. The Vercel checks on those PRs were preview builds only — they
# are not the live site, which is what made the gap easy to miss.
#
# WHAT IT RUNS
# Lint, tests and typecheck all gate the deploy.
#
# `lint` did not, for a while, and the note here said why: a few hundred
# pre-existing prettier violations in the large route files would have failed
# this workflow on its own first run. It also said what the right end state was —
# clear the debt in its own PR, then add the gate. That is what happened: the
# formatting was applied in one pass, the remaining `any`s are warnings rather
# than errors, and lint now runs first because it is the fastest of the three.
#
# typecheck was in that same excluded list for exactly one commit. The two
# errors keeping it out were real: ArticleCard passed an interpolated
# `/articles/${slug}` to <Link to>, where TanStack Router expects the route
# PATTERN plus params. Fixed to `to="/articles/$slug" params={{ slug }}`, which
# is what every other Link in the codebase already does, and the gate went in.
name: Deploy

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit —
  # e.g. after rotating the API token, or to roll forward a failed run.
  workflow_dispatch:

concurrency:
  # One deploy at a time. NOT cancel-in-progress: a cancelled `wrangler deploy`
  # can leave the upload half-done, and a superseded deploy is cheap next to an
  # ambiguous production state. Later pushes queue behind the current one.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Forks cannot read the secrets and would fail noisily on every push.
    if: github.repository == 'lior1nadlan-ui/orzadik'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # VITE_* MUST be present HERE, at build time. Vite inlines them into the
      # CLIENT bundle; there is no runtime lookup to fall back on, because in the
      # browser `process.env` compiles to `{}` (verified in the shipped bundle).
      #
      # This step had no env for its first three deploys, and that took the whole
      # site down for ~35 hours: src/integrations/supabase/client.ts throws
      # "Missing Supabase environment variable(s)" the moment any page touches the
      # browser Supabase client, which the homepage does, so every visitor got the
      # error boundary. Nothing failed loudly — the build succeeded, the deploy
      # succeeded, the Worker served, and SSR kept working because the SERVER reads
      # the same values from wrangler.jsonc `vars` at runtime. Only the client was
      # dead. Before CI existed the owner deployed by hand with a local .env, which
      # is why it had never surfaced.
      #
      # These two are NOT secrets: both are already committed in plaintext in
      # wrangler.jsonc, and a Supabase publishable key is designed to be public and
      # is protected by RLS. Keep the two files in step.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://whtjslgrrfzehivrknuv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iIXlA6UOH_jEMubtd2nW9A_bG9hPbaF

      # The deploy that broke the site was green at every step. This is the check
      # that would have caught it: if the publishable key is not inlined in the
      # client bundle, the browser client cannot be constructed and every page
      # throws. Fail here rather than shipping a site that only looks deployed.
      - name: Verify client bundle carries Supabase config
        run: |
          if ! grep -rq "sb_publishable_" dist/client/assets/*.js; then
            echo "::error::Supabase publishable key is NOT inlined in dist/client."
            echo "::error::Every page would throw 'Missing Supabase environment variable(s)'."
            echo "::error::Check the VITE_* env on the Build step above."
            exit 1
          fi
          echo "Client bundle carries the Supabase config."

      # wrangler is not a direct dependency: it arrives through
      # @cloudflare/vite-plugin, which both depends on it and declares it as a
      # peer, so npm ci installs the version the plugin was built against
      # (4.98.0 today). Adding it explicitly was tried and reverted — npm
      # resolved a newer major-minor and rewrote 4,300 lines of the lockfile,
      # which is a bigger production risk than the tidiness is worth. If it ever
      # needs pinning, pin it EXACTLY and regenerate the lock deliberately.
      #
      # `vite build` emits its own dist/server/wrangler.json — the built entry
      # (index.mjs), the ASSETS binding pointing at dist/client, the custom-domain
      # routes and the cron triggers. Deploying the ROOT wrangler.jsonc instead
      # would point `main` at the raw src/server.ts and ship no client assets, so
      # the config path here is load-bearing. Keep it in step with `npm run deploy`
      # in package.json.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
