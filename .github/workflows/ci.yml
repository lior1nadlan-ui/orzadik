# Gate pull requests on the same checks the deploy runs.
#
# WHY THIS EXISTS, SEPARATELY FROM deploy.yml
# deploy.yml runs `typecheck` and `test` — but only on push to main, inside the
# deploy job. So a pull request that breaks a test merges with a green tick, and
# the failure surfaces afterwards as a FAILED DEPLOY. Production then silently
# stops updating, which is the exact failure this repository already had once:
# four PRs of product photographs sat merged and invisible because nothing
# published them. Catching it before the merge is the whole point.
#
# Deliberately the same two commands as deploy.yml and in the same order, so a
# green PR means the deploy's gates will pass. `lint` is excluded here for the
# same reason it is excluded there: several hundred pre-existing prettier
# violations in the large route files would fail every run from day one. See the
# note at the top of deploy.yml.
#
# `build` is NOT repeated here. It is the slowest step by far and it cannot fail
# independently of typecheck in practice; the deploy still runs it, so a broken
# build blocks the release rather than the merge.
name: CI

on:
  pull_request:
  # Also on main, so the branch's own status is visible without waiting for a
  # deploy — and so a merge that breaks in combination with another PR is
  # attributed to the merge rather than to the next unlucky contributor.
  push:
    branches: [main]

concurrency:
  # Per branch/PR. Unlike the deploy, cancelling here IS wanted: superseded
  # commits do not need their results, and nothing is left half-written.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
