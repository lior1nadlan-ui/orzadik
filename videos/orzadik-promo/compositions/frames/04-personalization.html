  <body>
    <template>
      <style>
        @font-face{font-family:"Assistant";font-weight:300;font-style:normal;font-display:block;src:url("assets/fonts/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQtrhnEGE.ttf") format("truetype");}
        @font-face{font-family:"Assistant";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQtuZnEGE.ttf") format("truetype");}
        @font-face{font-family:"Assistant";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQttRnEGE.ttf") format("truetype");}
        @font-face{font-family:"Assistant";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQtjhgEGE.ttf") format("truetype");}
        @font-face{font-family:"Assistant";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQtgFgEGE.ttf") format("truetype");}

        /* Root: style by #root, never a class (scoping rule). */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #fcfaf6;
          font-family: "Assistant", sans-serif;
          direction: rtl;
        }

        /* ---- full-bleed dimmed / blurred background tallit (depth layer 1) ---- */
        .bg {
          position: absolute;
          inset: 0;
          background: #fcfaf6; /* dependable cream ground on the clip, not #root */
        }
        .bg-img {
          position: absolute;
          inset: -40px; /* bleed past edges so the blur has no hard rim */
          width: calc(100% + 80px);
          height: calc(100% + 80px);
          object-fit: cover;
          opacity: 0;
          /* selective focus: background sits soft + quiet, the cover stays sharp */
          filter: blur(9px) brightness(1.03) saturate(0.9);
          transform: scale(1.04);
          will-change: opacity;
        }
        .bg-veil {
          /* cream wash keeps the ground quiet so the embroidery reads */
          position: absolute;
          inset: 0;
          background: linear-gradient(
            120deg,
            rgba(252, 250, 246, 0.62),
            rgba(252, 250, 246, 0.4) 55%,
            rgba(252, 250, 246, 0.66)
          );
        }

        /* ---- gold radial bloom (depth layer 2, behind the cover) ---- */
        .bloom {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            48% 42% at 43% 40%,
            rgba(212, 175, 55, 0.36),
            rgba(212, 175, 55, 0.15) 44%,
            rgba(236, 220, 167, 0.06) 66%,
            rgba(252, 250, 246, 0) 80%
          );
          opacity: 0;
          transform: scale(0.9);
          transform-origin: 43% 40%;
          pointer-events: none;
          will-change: opacity, transform;
        }

        /* ---- hero embroidered cover, right ~55% (depth layer 3, focal) ---- */
        .hero {
          position: absolute;
          inset: 0;
        }
        .hero-frame {
          position: absolute;
          right: 24px;
          top: 300px;
          width: 586px;
          height: 1010px;
          padding: 12px;
          background: #f2eee7;
          border: 1px solid rgba(212, 175, 55, 0.85);
          opacity: 0;
          will-change: opacity, transform;
        }
        .hero-frame::after {
          /* fine inner gold hairline — the hairline-elevation signature */
          content: "";
          position: absolute;
          inset: 6px;
          border: 1px solid rgba(172, 123, 73, 0.5);
          pointer-events: none;
        }
        .hero-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        /* ---- left text frame + drawn line + stitch + sub-line (foreground) ---- */
        .textwrap {
          position: absolute;
          inset: 0;
        }
        .frame {
          position: absolute;
          left: 56px;
          top: 596px;
          width: 380px;
          height: 452px;
          box-sizing: border-box;
          padding: 40px 34px 36px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 26px;
          background: rgba(242, 238, 231, 0.55);
          border: 1px solid rgba(212, 175, 55, 0.8);
          opacity: 0;
          will-change: opacity, transform;
        }
        .line {
          direction: rtl;
          text-align: right;
          color: #D4AF37;
          font-weight: 600;
          font-size: 56px;
          line-height: 1.16;
          letter-spacing: -0.005em;
          text-shadow: 0 1px 10px rgba(212, 175, 55, 0.28);
          /* clip reveal: physical-right → physical-left (= RTL writing order) */
          --clip: 100%;
          clip-path: inset(-14% 0 -14% var(--clip));
          will-change: clip-path;
        }
        .stitch {
          position: relative;
          width: 312px;
          height: 34px;
          align-self: flex-end;
        }
        .stitch svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .thread {
          fill: none;
          stroke: #ac7b49;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .gleam {
          position: absolute;
          top: 8px;
          left: 0;
          width: 22px;
          height: 22px;
          margin: -11px 0 0 -11px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(255, 246, 214, 0.95),
            rgba(212, 175, 55, 0.55) 40%,
            rgba(212, 175, 55, 0) 72%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
        .sub {
          position: absolute;
          left: 56px;
          top: 1076px;
          width: 380px;
          direction: rtl;
          text-align: right;
          color: #1f1915;
          font-weight: 400;
          font-size: 33px;
          line-height: 1.4;
          opacity: 0;
          will-change: opacity, transform;
        }
      </style>

      <div id="root" data-composition-id="04-personalization" data-duration="4.1" data-width="1080" data-height="1920">
        <!-- layer 1 — dimmed / blurred background tallit -->
        <div
          class="clip bg"
          data-start="0"
          data-duration="4.1"
          data-track-index="0"
        >
          <img
            class="bg-img"
            id="p04-bg-img"
            src="assets/cat-tallit-cdg80v-6.webp"
            alt=""
          />
          <div class="bg-veil"></div>
        </div>

        <!-- layer 2 — gold bloom -->
        <div
          class="clip bloom"
          id="p04-bloom"
          data-start="0"
          data-duration="4.1"
          data-track-index="1"
        ></div>

        <!-- layer 3 — hero embroidered cover (right ~55%) -->
        <div
          class="clip hero"
          data-start="0"
          data-duration="4.1"
          data-track-index="2"
        >
          <div class="hero-frame" id="p04-hero-frame">
            <img
              class="hero-img"
              id="p04-hero-img"
              src="assets/cat-tallit-tefillin-covers-b1m2gdsl.webp"
              alt=""
            />
          </div>
        </div>

        <!-- foreground — left text frame, drawn line, stitch, sub-line -->
        <div
          class="clip textwrap"
          data-start="0"
          data-duration="4.1"
          data-track-index="3"
        >
          <div class="frame" id="p04-frame">
            <div class="line" id="p04-line">רקמה וחריטה אישית</div>
            <div class="stitch">
              <svg viewBox="0 0 312 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path
                  class="thread"
                  id="p04-thread"
                  d="M 308 17 C 268 5, 250 29, 208 17 S 144 5, 104 17 S 40 29, 4 15"
                />
              </svg>
              <div class="gleam" id="p04-gleam"></div>
            </div>
          </div>
          <div class="sub" id="p04-sub">כל פריט, רק שלכם</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const bloom = document.getElementById("p04-bloom");
        const thread = document.getElementById("p04-thread");
        const gleam = document.getElementById("p04-gleam");

        // ── Scene 1 (0–1.3s) — cover held hero, ground quiet, frame ready ──
        // Background tallit fades in dimmed + blurred (selective focus).
        tl.fromTo(
          "#p04-bg-img",
          { opacity: 0 },
          { opacity: 0.5, duration: 0.7, ease: "power2.out" },
          0,
        );

        // Hero cover — visible by t <= 0.5s (fromTo entrance, gentle settle).
        tl.fromTo(
          "#p04-hero-frame",
          { opacity: 0, scale: 0.965 },
          { opacity: 1, scale: 1, duration: 0.95, ease: "power3.out" },
          0,
        );

        // Gold bloom blooms in behind the cover, landing as it settles (~1.3s).
        tl.fromTo(
          bloom,
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" },
          0.3,
        );

        // Empty gold text-frame arrives, ready on the left.
        tl.fromTo(
          "#p04-frame",
          { opacity: 0, scale: 0.975 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
          0.55,
        );

        // ── Scene 2 (1.3–2.5s) — the line embroiders itself into the frame ──
        // Signature A (svg-path-draw): a gold thread stitches on, right→left.
        const len = thread.getTotalLength();
        thread.style.strokeDasharray = String(len);
        thread.style.strokeDashoffset = String(len);
        tl.to(
          thread,
          { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" },
          1.35,
        );

        // Signature B: the real Assistant glyphs reveal RTL via a moving clip
        // (physical-right first = first Hebrew character first) — synced to the
        // thread so the words read as being stitched on.
        tl.fromTo(
          "#p04-line",
          { "--clip": "100%" },
          { "--clip": "0%", duration: 1.1, ease: "power2.out" },
          1.3,
        );

        // Needle gleam rides the writing edge, then fades as the line completes.
        tl.fromTo(
          gleam,
          { opacity: 0 },
          { opacity: 0.9, duration: 0.2, ease: "power1.out" },
          1.35,
        );
        tl.fromTo(
          gleam,
          { x: 306 },
          { x: 0, duration: 1.0, ease: "power2.out" },
          1.35,
        );
        tl.to(gleam, { opacity: 0, duration: 0.34, ease: "power1.in" }, 2.18);

        // ── Scene 3 (2.5–3.5s) — sub-line settles, held climax, embroidery gleams ──
        tl.fromTo(
          "#p04-sub",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
          2.55,
        );

        // Faint gold gleam on the hold — bounded sine breathe on the bloom only
        // (no yoyo/loop; sin(0)=0 so it starts at the bloom's resting state).
        const PEAK = 1.0;
        const OP_AMP = 0.07;
        const SC_AMP = 0.02;
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 0.8, // ~2.75s per breath across the 2.2s hold
            duration: 2.2,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(phase.p);
              bloom.style.opacity = String(PEAK + s * OP_AMP);
              bloom.style.transform = "scale(" + (1 + s * SC_AMP) + ")";
            },
          },
          1.3,
        );

        window.__timelines["04-personalization"] = tl;
      </script>
    </template>
  </body>
