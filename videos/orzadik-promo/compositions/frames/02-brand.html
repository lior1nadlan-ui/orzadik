  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---------- Scene 1 (0.0–1.2s): logo mark fades + gently scales into center ----------
    // fromTo so the collapsed/soft start is exact at t=0 under seek. Calm long-tail settle
    // (power3.out, 0.9→1.0) — premium, no overshoot. Visible well before t=0.5s.
    tl.fromTo("#f02b-logo",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
      0.0);

    // Gold sun-bloom blooms in behind the mark, landing on its settle (one beat).
    const glow = document.getElementById("f02b-glow");
    tl.fromTo(glow,
      { opacity: 0, scale: 0.9 },
      { opacity: 0.9, scale: 1, duration: 1.1, ease: "power2.out" },
      0.0);

    // ---------- Scene 3 tail: bounded idle breathe on the bloom (NOT a loop) ----------
    // A single finite tween advances a phase; onUpdate nudges opacity + scale a hair.
    // sin(0)=0 so the breathe begins exactly at the bloom's resting state — no jump.
    const GLOW_PEAK = 0.9, OP_AMP = 0.06, SC_AMP = 0.02, CYCLES = 0.7;
    const phase = { p: 0 };
    tl.to(phase,
      { p: Math.PI * 2 * CYCLES, duration: 1.9, ease: "none",
        onUpdate: () => {
          const s = Math.sin(phase.p);
          glow.style.opacity = String(GLOW_PEAK + s * OP_AMP);
          glow.style.transform = "scale(" + (1 + s * SC_AMP) + ")";
        } },
      1.1);

    // ---------- Scene 2 (1.2–2.2s): wordmark cascades in beneath the mark (RTL) ----------
    // Words reveal in reading order (right→left = DOM order) on a deterministic stagger.
    const words = gsap.utils.toArray(".f02b-word");
    words.forEach((el, i) => {
      tl.fromTo(el,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.2 + i * 0.12);
    });

    // Gold hairline rules draw OUTWARD from the center (svg-path-draw).
    document.querySelectorAll(".f02b-divider path").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len); // start hidden; grows from the center (M point) outward
    });
    // Center diamond pops first, then the two rules draw outward.
    tl.fromTo("#f02b-dia-c",
      { opacity: 0 },
      { opacity: 1, duration: 0.35, ease: "power2.out" },
      1.48);
    tl.to("#f02b-rule-left",  { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.55);
    tl.to("#f02b-rule-right", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.55);
    // Terminal diamonds settle in as the rules reach the ends.
    tl.fromTo(".f02b-dia-end",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power1.out" },
      2.0);

    // ---------- Scene 3 (2.2–3.0s): sub-line fades up; full lockup holds STILL ----------
    tl.fromTo("#f02b-subline",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
      2.2);

    window.__timelines["02-brand"] = tl;
  </script>
