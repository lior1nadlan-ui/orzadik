<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F2EEE7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-brand"
        class="scene"
        data-composition-id="02-brand"
        data-composition-src="compositions/frames/02-brand.html"
        data-start="3.5"
        data-duration="3.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-showcase"
        class="scene"
        data-composition-id="03-showcase"
        data-composition-src="compositions/frames/03-showcase.html"
        data-start="6.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-personalization"
        class="scene"
        data-composition-id="04-personalization"
        data-composition-src="compositions/frames/04-personalization.html"
        data-start="10"
        data-duration="4.1"
        data-track-index="1"
      ></div>

      <div
        id="el-05-trust"
        class="scene"
        data-composition-id="05-trust"
        data-composition-src="compositions/frames/05-trust.html"
        data-start="13.5"
        data-duration="3.7"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="16.7"
        data-duration="3.3"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/riser-soft.mp3"
        data-start="0"
        data-duration="4.97"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/chime-soft.mp3"
        data-start="3.5"
        data-duration="1.273"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/impact-soft.mp3"
        data-start="6.5"
        data-duration="2.758"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/shimmer-soft.mp3"
        data-start="10"
        data-duration="3.329"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/tick-soft.mp3"
        data-start="13.5"
        data-duration="3.5"
        data-track-index="24"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/chime-bright.mp3"
        data-start="16.7"
        data-duration="1.334"
        data-track-index="25"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-brand", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-brand", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 6.5);
        tl.fromTo("#el-03-showcase", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 6.5);
        tl.to("#el-03-showcase", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-04-personalization", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-04-personalization", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 13.5);
        tl.fromTo("#el-05-trust", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 13.5);
        tl.to("#el-05-trust", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16.7);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16.7);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
